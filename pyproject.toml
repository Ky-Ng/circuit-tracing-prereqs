[project]
name = "circuit-tracing-prereqs"
version = "0.1.0"
description = "Building Skills for AI Safety and Circuit Tracing Research"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "torch>=2.3.0",
    "einops>=0.7.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
